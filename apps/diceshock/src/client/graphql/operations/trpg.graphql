fragment TrpgSessionFields on TrpgSession {
  id
  storeId
  storeName
  address
  tableId
  tableName
  hostName
  title
  description
  moduleName
  gameSystem
  status
  startsAt
  deadline
  priorityUntil
  durationMinutes
  sessionType
  feeCents
  capacity
  minimum
  timeHint
  tags
  revision
  reason
  confirmedCount
  interestedCount
  pendingCount
  remaining
  canReview
  canEdit
  registrationOpen
}

query TrpgDashboard($filters: TrpgFilters) {
  trpgStores(managed: true) {
    id
    name
    canReview
  }
  trpgSessions(filters: $filters, managed: true) {
    items {
      ...TrpgSessionFields
    }
    hasMore
  }
  trpgProfile {
    id
    nickname
    admin
  }
}

query TrpgResources($storeId: ID!) {
  trpgTables(storeId: $storeId) {
    id
    name
    capacity
  }
}

query TrpgManagementContext {
  trpgStores(managed: true) { id name canReview }
  trpgProfile { id nickname admin }
}

query TrpgDirectory($storeId: ID, $search: String = "", $hostsOnly: Boolean = false, $membersOnly: Boolean = false, $offset: Int = 0) {
  trpgDirectory(storeId: $storeId, search: $search, hostsOnly: $hostsOnly, membersOnly: $membersOnly, offset: $offset) {
    items { id uid nickname role phone points balanceCents storedValueMember timePlans { id type startsAt expiresAt } host staff disabled }
    hasMore
  }
}

query TrpgHosts($storeId: ID!) {
  trpgHosts(storeId: $storeId) {
    id
    uid
    nickname
  }
}

query TrpgRoster($id: ID!, $offset: Int = 0) {
  trpgRoster(id: $id, offset: $offset) {
    items {
      id
      nickname
      status
      phone
      reason
    }
    hasMore
  }
}

query TrpgMembers($storeId: ID!, $search: String!) {
  trpgMembers(storeId: $storeId, search: $search) {
    id
    uid
    nickname
  }
}

query TrpgMemberHistory($storeId: ID, $userId: ID!, $offset: Int) {
  trpgMemberHistory(storeId: $storeId, userId: $userId, offset: $offset) {
    items {
      ...TrpgSessionFields
    }
    hasMore
  }
}

mutation CreateTrpgSession($input: TrpgSessionInput!) {
  createTrpgSession(input: $input) {
    ...TrpgSessionFields
  }
}

mutation ResubmitTrpgSession($id: ID!, $revision: Int!, $input: TrpgSessionInput!) {
  resubmitTrpgSession(id: $id, revision: $revision, input: $input) {
    success
  }
}

mutation TransitionTrpgSession($id: ID!, $revision: Int!, $action: String!, $reason: String) {
  transitionTrpgSession(
    id: $id
    revision: $revision
    action: $action
    reason: $reason
  ) {
    success
  }
}

mutation ScheduleTrpgSession($id: ID!, $revision: Int!, $tableId: ID!, $startsAt: String!, $deadline: String!) {
  scheduleTrpgSession(
    id: $id
    revision: $revision
    tableId: $tableId
    startsAt: $startsAt
    deadline: $deadline
  ) {
    success
  }
}

mutation ReviewTrpgRegistration($id: ID!, $registrationId: ID!, $decision: String!, $depositConfirmed: Boolean, $reason: String) {
  reviewTrpgRegistration(
    id: $id
    registrationId: $registrationId
    decision: $decision
    depositConfirmed: $depositConfirmed
    reason: $reason
  ) {
    success
  }
}

mutation SetTrpgAccess($id: ID!, $storeId: ID!, $staff: Boolean!, $host: Boolean!) {
  setTrpgAccess(id: $id, storeId: $storeId, staff: $staff, host: $host) {
    success
  }
}

mutation SetTrpgHost($id: ID!, $host: Boolean!) { setTrpgHost(id: $id, host: $host) { success } }
mutation SetTrpgMember($id: ID!, $member: Boolean!) { setTrpgMember(id: $id, member: $member) { success } }
query TrpgRewardsAdmin {
  trpgProfile { admin }
  trpgStores(managed: true) { id name canReview }
  trpgRewards(managed: true) { id title description cover points stock active revision }
}
query TrpgMailboxAdmin($offset: Int = 0) {
  trpgMail(managed: true, offset: $offset) { id kind message reply createdAt nickname }
}
mutation SaveTrpgReward($input: TrpgRewardInput!) { saveTrpgReward(input: $input) { success } }
mutation ConsumeTrpgVoucher($id: ID!, $storeId: ID!) { consumeTrpgVoucher(id: $id, storeId: $storeId) { success } }
mutation ReplyTrpgMail($id: ID!, $reply: String!) { replyTrpgMail(id: $id, reply: $reply) { success } }
