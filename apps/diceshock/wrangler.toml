"$schema" = "node_modules/wrangler/config-schema.json"

name = "diceshock-behover"
compatibility_date = "2025-06-02"
main = "./src/main.tsx"
compatibility_flags = ["nodejs_compat_v2"]
account_id = "3244c8f91cd34317ce18652158e5853a"
workers_dev = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[[kv_namespaces]]
binding = "KV"
id = "59911665c0654c54814d81fbb213aae4"

[[d1_databases]]
binding = "DB"
database_name = "diceshock"
database_id = "24c01d5e-c4d7-4b13-bb59-5ad3373971e9"
migrations_dir = "../../drizzle"


[[r2_buckets]]
binding = "R2"
bucket_name = "diceshock"
preview_bucket_name = "diceshock-preview"

[[r2_buckets]]
binding = "RAW_FEED"
bucket_name = "ds-raw-feed"

[[r2_buckets]]
binding = "LIBRARY"
bucket_name = "ds-library"

[[durable_objects.bindings]]
name = "DS_SUBSCRIPTION"
class_name = "DsSubscriptionDO"

[[durable_objects.bindings]]
name = "PUBSUB"
class_name = "PubSubDO"

[[durable_objects.bindings]]
name = "WECHAT_AGENT"
class_name = "WechatAgentDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeatTimerDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SocketDO"]
deleted_classes = ["SeatTimerDO"]

[[migrations]]
tag = "v3"
new_classes = ["PubSubDO"]

[[migrations]]
tag = "v4"
renamed_classes = [{ from = "SocketDO", to = "DsSubscriptionDO" }]

[[migrations]]
tag = "v5"
new_classes = ["WechatAgentDO"]

[browser]
binding = "BROWSER"

[[queues.producers]]
binding = "IMAGE_QUEUE"
queue = "diceshock-image-processing"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "diceshock-notifications"


[[queues.consumers]]
queue = "diceshock-image-processing"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 2

[[queues.consumers]]
queue = "diceshock-notifications"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3



[triggers]
crons = ["0 4-22 * * *", "0 16 * * *"]

[vars]
AUTH_URL = "https://diceshock.com"
CAPTCHA_PREFIX = "1bqoki"
CAPTCHA_SCENE_ID = "1iwji8e9"
DS_WECHAT_MINI_APP_ID = "wx2dea4e74c1ecc1c5"

# AI Search instance
[[ai_search]]
binding = "AI_SEARCH"
instance_name = "nameless-resonance-0d56"
remote = true

# Workers AI (embeddings, etc.)
[ai]
binding = "AI"
remote = true

# Secrets (set via `wrangler secret put`):
# WECHAT_OPEN_APP_ID
# WECHAT_OPEN_APP_SECRET
# WECHAT_MP_APP_ID
# WECHAT_MP_APP_SECRET
# WECHAT_MP_TOKEN              — 服务号消息验签 Token
# WECHAT_MP_ENCODING_AES_KEY   — 消息加解密密钥
# DS_WECHAT_MINI_APP_SECRET    — 小程序 AppSecret（AppID 见 vars）
# DEEPSEEK_API_KEY             — DeepSeek V4 Flash API Key
# CF_AI_GATEWAY_ID             — AI Gateway ID

# ─── Preview (测试) Environment ───────────────────────────────────────
# Deploy: wrangler deploy --env preview
# Secrets: wrangler secret put <NAME> --env preview

[env.preview]
name = "diceshock-behover-preview"
workers_dev = true

[env.preview.vars]
AUTH_URL = "https://diceshock-behover-preview.hndppt.workers.dev"
CAPTCHA_PREFIX = "1bqoki"
CAPTCHA_SCENE_ID = "1iwji8e9"
DS_WECHAT_MINI_APP_ID = "wx2dea4e74c1ecc1c5"

# D1: isolated preview databases
[[env.preview.d1_databases]]
binding = "DB"
database_name = "diceshock-preview"
database_id = "8a1e57fc-e2a7-4c99-b35e-d9c6baff838e"
migrations_dir = "../../drizzle"


# KV: isolated preview namespace
[[env.preview.kv_namespaces]]
binding = "KV"
id = "92dac5fc2dcc43a9aafc40aaf5ca5108"

# R2: reuse production buckets (read-heavy, safe to share)
[[env.preview.r2_buckets]]
binding = "R2"
bucket_name = "diceshock"

[[env.preview.r2_buckets]]
binding = "RAW_FEED"
bucket_name = "ds-raw-feed"

[[env.preview.r2_buckets]]
binding = "LIBRARY"
bucket_name = "ds-library"

# Durable Objects: reuse production classes (same worker script)
[[env.preview.durable_objects.bindings]]
name = "DS_SUBSCRIPTION"
class_name = "DsSubscriptionDO"

[[env.preview.durable_objects.bindings]]
name = "PUBSUB"
class_name = "PubSubDO"

[[env.preview.durable_objects.bindings]]
name = "WECHAT_AGENT"
class_name = "WechatAgentDO"

# Queues: reuse production queues (preview traffic minimal)
[[env.preview.queues.producers]]
binding = "IMAGE_QUEUE"
queue = "diceshock-image-processing"

[[env.preview.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "diceshock-notifications"


# No queue consumers in preview — production worker handles all consumers
# No cron triggers in preview — avoid duplicate scheduled jobs

# Browser rendering
[env.preview.browser]
binding = "BROWSER"

# AI Search: reuse production instance
[[env.preview.ai_search]]
binding = "AI_SEARCH"
instance_name = "nameless-resonance-0d56"
remote = true

# Workers AI
[env.preview.ai]
binding = "AI"
remote = true

# Version metadata
[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

# Observability: mirror production settings
[env.preview.observability]
enabled = false
head_sampling_rate = 1

[env.preview.observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[env.preview.observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
